name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
      - LICENSE
      - '.vscode/**'
      - .gitignore
      - .gitattributes

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
      - LICENSE
      - '.vscode/**'
      - .gitignore
      - .gitattributes

jobs:
  validate:
    name: Lint, Typecheck & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 24.x
          - os: windows-latest
            node-version: 24.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build extension bundle
        run: pnpm run build
